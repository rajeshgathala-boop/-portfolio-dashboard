function b64u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function cookieSet(k,v){try{document.cookie=encodeURIComponent(k)+"="+encodeURIComponent(v)+"; Max-Age=31536000; Path=/-portfolio-dashboard/; SameSite=Lax; Secure"}catch(e){}}
(async()=>{
  const msg=document.getElementById("msg");
  try{
    const m=location.hash.match(/(?:^#|[&#])k=([^&]+)/);
    if(!m)throw Error("Missing setup key");
    const key=b64u(decodeURIComponent(m[1]));
    const cryptoKey=await crypto.subtle.importKey("raw",key,{name:"AES-GCM"},false,["decrypt"]);
    const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64u(IV)},cryptoKey,b64u(DATA));
    const json=new TextDecoder().decode(plain);
    const holdings=JSON.parse(json);
    if(!Array.isArray(holdings)||holdings.length!==19)throw Error("Invalid portfolio");
    localStorage.setItem("portfolio_holdings",json);
    cookieSet("portfolio_holdings",json);
    if(localStorage.getItem("portfolio_holdings")!==json)throw Error("Safari blocked storage");
    msg.className="ok";
    msg.textContent="19 holdings imported. Opening the portfolio…";
    setTimeout(()=>location.replace("Portfolio_v13_1.html"),700);
  }catch(e){
    msg.className="err";
    msg.textContent="Could not import the portfolio. Open this link directly in Safari. "+e.message;
  }
})();
